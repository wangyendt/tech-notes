<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
<title id="title">运动控制与心率数据分开验证</title><desc id="desc">控制面由原型通过无障碍和只读系统桥导航某App，观察业务状态。数据面由设备经某App维持的蓝牙连接产生本机日志，授权辅助进程解析后交回原型保存。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#56677a" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="590" rx="12" fill="#f5f8fb"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#273449">
<text x="40" y="48" font-size="25" font-weight="700">运动控制与心率接收</text>
<text x="40" y="80" font-size="16" fill="#56677a">配套 App 保持蓝牙连接；采集 APK 控制页面并解析本机日志。</text>
<path d="M40 114H960" stroke="#cbd9e5"/>
<text x="40" y="155" font-size="19" fill="#275b8b" font-weight="700">控制面</text>
<g fill="#fff" stroke="#8ba6bb" stroke-width="1.5"><rect x="40" y="180" width="200" height="96" rx="6"/><rect x="320" y="180" width="290" height="96" rx="6"/><rect x="700" y="180" width="260" height="96" rx="6"/></g>
<text x="140" y="218" text-anchor="middle" font-size="21">采集 APK</text><text x="140" y="247" text-anchor="middle" font-size="15" fill="#56677a">用户发起 · 可取消</text>
<text x="465" y="218" text-anchor="middle" font-size="20">无障碍 + 只读 UI 桥</text><text x="465" y="247" text-anchor="middle" font-size="15" fill="#56677a">控件与窗口校验 → 有界输入</text>
<text x="830" y="218" text-anchor="middle" font-size="21">某 App 的运动界面</text><text x="830" y="247" text-anchor="middle" font-size="15" fill="#56677a">计时与结束态确认</text>
<g stroke="#56677a" stroke-width="2" marker-end="url(#arrow)"><path d="M242 228H312"/><path d="M612 228H692"/></g>
<text x="40" y="340" font-size="19" fill="#19756f" font-weight="700">数据面</text>
<g fill="#fff" stroke="#72a7a3" stroke-width="1.5"><rect x="40" y="365" width="200" height="105" rx="6"/><rect x="320" y="365" width="290" height="105" rx="6"/><rect x="700" y="365" width="260" height="105" rx="6"/></g>
<text x="140" y="402" text-anchor="middle" font-size="21">可穿戴设备</text><text x="140" y="432" text-anchor="middle" font-size="15" fill="#56677a">某 App 保持蓝牙连接</text>
<text x="465" y="402" text-anchor="middle" font-size="20">手机本机蓝牙日志流</text><text x="465" y="432" text-anchor="middle" font-size="15" fill="#56677a">授权辅助进程 · 分层解析</text>
<text x="830" y="402" text-anchor="middle" font-size="21">APK 私有记录</text><text x="830" y="432" text-anchor="middle" font-size="15" fill="#56677a">时间戳 · 原始值 · 质量统计</text>
<g stroke="#56677a" stroke-width="2" marker-end="url(#arrow)"><path d="M242 417H312"/><path d="M612 417H692"/></g>
<path d="M40 505H960" stroke="#cbd9e5"/><text x="40" y="541" font-size="17" fill="#56677a">输出：目标运动记录、时间戳和数据质量统计。</text><text x="40" y="570" font-size="15" fill="#56677a">测试手机的调试日志接口，非通用 Android API。</text>
</g></svg>
